<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipe network · MCEN 3021</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='white' stroke='%231f2933' stroke-width='3'/%3E%3Cpath d='M11 8 L25 16 L11 24 Z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Pipe network <span>MCEN 3021</span></div>
    <div class="tools">
      <button type="button" id="btn-new" title="Start an empty design">New</button>
      <button type="button" id="btn-open" title="Open a design file (.json) saved by this app">Open design</button>
      <button type="button" id="btn-download" title="Save this design as a file. This is the file you submit.">Download design</button>
      <select id="examples" title="Load a small example system" aria-label="Examples">
        <option value="">Examples…</option>
      </select>
      <span class="sep"></span>
      <button type="button" id="btn-undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
      <button type="button" id="btn-redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
      <span class="sep"></span>
      <select id="export" title="Save the drawing as a picture, for a report" aria-label="Save a picture">
        <option value="">Save picture…</option>
        <option value="svg">Diagram as SVG</option>
        <option value="png">Diagram as PNG</option>
      </select>
      <button type="button" id="btn-help" title="How to use the app, and a glossary">Help</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
  </header>

  <main class="workspace">
    <aside class="palette" id="palette" aria-label="Components">
      <button type="button" class="tile" data-type="tank" title="Tank: drag onto the canvas">
        <svg viewBox="-26 -22 52 44"><rect x="-19" y="-6" width="38" height="21" class="p-water"/><path d="M-20,-16 V16 H20 V-16" class="p-line" style="fill:none"/></svg>
        Tank
      </button>
      <button type="button" class="tile" data-type="junction" title="Junction: drag onto the canvas">
        <svg viewBox="-26 -22 52 44"><path d="M-22,0 H22 M0,0 V18" class="p-pipe"/><circle r="6" class="p-node"/></svg>
        Junction
      </button>
      <button type="button" class="tile" data-type="pump" title="Pump: drag onto the canvas">
        <svg viewBox="-26 -22 52 44"><circle r="15" class="p-line"/><path d="M-5,-8 L9,0 L-5,8 Z" class="p-fill"/></svg>
        Pump
      </button>
      <button type="button" class="tile" data-type="valve" title="Valve: drag onto the canvas">
        <svg viewBox="-26 -22 52 44"><path d="M-14,-9 V9 L0,0 Z M14,-9 V9 L0,0 Z M0,0 V-13 M-6,-13 H6" class="p-line"/></svg>
        Valve
      </button>
      <button type="button" class="tile" data-type="label" title="Text: a note of your own on the drawing">
        <svg viewBox="-26 -22 52 44"><path d="M-12,-11 H12 M0,-11 V12 M-5,12 H5" class="p-line" style="fill:none"/></svg>
        Text
      </button>
      <button type="button" class="tile" id="pipe-tool" title="Pipe: drag from a port (small circle) on one component to a port on another. Or click here, then drag from one component to another.">
        <svg viewBox="-26 -22 52 44"><path d="M-18,8 L18,-8" class="p-pipe"/><circle cx="-18" cy="8" r="4" class="p-port"/><circle cx="18" cy="-8" r="4" class="p-port"/></svg>
        Pipe
      </button>
      <p class="palette-hint">Drag onto the canvas. For a pipe, drag from port to port.</p>
    </aside>

    <section class="stage">
      <svg id="canvas" class="canvas" aria-label="Network drawing"></svg>
      <div class="zoom">
        <button type="button" id="btn-zoom-in" title="Zoom in">+</button>
        <button type="button" id="btn-zoom-out" title="Zoom out">−</button>
        <button type="button" id="btn-fit" title="Fit the whole network in view">Fit</button>
      </div>
      <div class="viewopts" id="viewopts">
        <label>Color pipes by
          <select id="opt-color">
            <option value="none">nothing</option>
            <option value="velocity">speed</option>
            <option value="pressure">pressure</option>
          </select>
        </label>
        <label><input type="checkbox" id="opt-width"> width shows flow rate</label>
        <label><input type="checkbox" id="opt-animate"> moving dashes</label>
        <span class="color-legend" id="color-legend" hidden></span>
      </div>
      <div class="pipe-banner" id="pipe-banner" hidden>Pipe tool: drag from one component to another. Esc to cancel.</div>
    </section>

    <aside class="panel" id="panel" aria-label="Properties"></aside>

    <section class="results">
      <div class="resizer" id="resizer" title="Drag to resize"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="results-body" id="results-body"></div>
    </section>
  </main>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
